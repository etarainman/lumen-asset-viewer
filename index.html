
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambiflo Asset LCM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.1); 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(59, 130, 246, 0.3); 
        border-radius: 10px;
      }

      .glass-panel {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      .building-label-3d {
        color: white;
        background: rgba(15, 23, 42, 0.9);
        padding: 4px 10px;
        border-radius: 4px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid rgba(59, 130, 246, 0.5);
      }

      /* Leaflet Overrides */
      .leaflet-container {
        background: #dde1e7 !important;
      }
      .leaflet-popup-content-wrapper {
        background: rgba(15, 23, 42, 0.95) !important;
        color: white !important;
        border-radius: 16px !important;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 0 !important;
      }
      .leaflet-popup-content {
        margin: 0 !important;
        padding: 0 !important;
      }
      .leaflet-popup-tip {
        background: rgba(15, 23, 42, 0.95) !important;
      }

      /* Overlay (demo) pin labels are hidden below the zoom threshold to
         avoid clutter with hundreds of pins; the dot itself stays visible. */
      .demo-pin-label {
        display: none;
      }
      .overlay-labels-visible .demo-pin-label {
        display: block;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "three": "https://unpkg.com/three@0.173.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.173.0/examples/jsm/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.1",
    "leaflet": "https://esm.sh/leaflet@^1.9.4",
    "three/": "https://esm.sh/three@^0.182.0/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-950 text-slate-200">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
